services:
  postgres:
    image: postgres:16-alpine
    container_name: mentoripath-db
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME:-mentorat_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Indian/Antananarivo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mentorat_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mentoripath-network

  ia_service:
    build:
      context: ./ia_service
      dockerfile: Dockerfile
    container_name: mentoripath-ia
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-mentorat_db}
      WEIGHT_COMPETENCES: 0.40
      WEIGHT_DISPONIBILITE: 0.25
      WEIGHT_OBJECTIFS: 0.20
      WEIGHT_REPUTATION: 0.15
      SCORE_MIN: 0.10
      TOP_N: 10
      PORT: 8001
      TZ: Indian/Antananarivo
    ports:
      - "8001:8001"
    depends_on:
      - postgres
    networks:
      - mentoripath-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mentoripath-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mentorat_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      IA_SERVICE_URL: http://ia_service:8001
      TZ: Indian/Antananarivo
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - ia_service
    networks:
      - mentoripath-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: mentoripath-web
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      TZ: Indian/Antananarivo
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - mentoripath-network

volumes:
  postgres_data:
  uploads_data:

networks:
  mentoripath-network:
    driver: bridge